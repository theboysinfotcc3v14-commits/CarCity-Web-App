<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarCity Web - Telemetria & Proteção Automotiva</title>
    <meta name="description" content="Plataforma completa de telemetria veicular IoT, proteção veicular, monitoramento de frotas, modo pânico, mapa de riscos e gestão B2B com controle de acesso RBAC." />
    <meta property="og:title" content="CarCity Web - Telemetria & Proteção Automotiva" />
    <meta property="og:description" content="Plataforma completa de telemetria veicular IoT, proteção veicular, monitoramento de frotas, modo pânico, mapa de riscos e gestão B2B com controle de acesso RBAC." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('carcity_theme') || 'dark';
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0B1A2E] text-[#F1F5F9] dark:bg-[#0B1A2E] dark:text-[#F1F5F9] transition-colors duration-200 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
